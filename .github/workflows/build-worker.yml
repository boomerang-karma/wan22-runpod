# Builds worker/ for linux/amd64 and pushes to GitHub Container Registry.
# Run it from the Actions tab (workflow_dispatch) or push a tag like worker-v0.1.0.
# Image: ghcr.io/<owner>/wan22-runpod-worker:<tag>. Either make the package public (Package settings) or add a
# RunPod container registry auth and put its id in config.yaml -> image.registry_auth_id.
name: build-worker
on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        default: "0.1.0"
  push:
    tags: ["worker-v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (torch + CUDA wheels are several GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then tag="${{ inputs.tag }}"; else tag="${GITHUB_REF_NAME#worker-v}"; fi
          echo "image=ghcr.io/${owner}/wan22-runpod-worker:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
      - run: echo "Pushed ${{ steps.meta.outputs.image }} — put this in config.yaml -> image.name"
